name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Dépendances alignées sur le SDK
        run: npx expo install --check
